name: track_your_task
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  auto_animated: ^3.2.0
  flutter_displaymode: ^0.7.0
  get: ^4.7.2
  get_storage: ^2.1.1
  provider: ^6.1.5+1
  flutter_screenutil: ^5.9.3
  rxdart: ^0.28.0
  dio: ^5.9.0
  intl: ^0.20.2
  device_info_plus: ^12.1.0
  get_it: ^8.2.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_svg: ^2.2.1
  pinput: ^6.0.1
  path_provider: ^2.1.5
  permission_handler: ^12.0.1
  video_player: ^2.10.0
  path: ^1.9.1
  carousel_slider: ^5.1.1
  lottie: ^3.3.2
  record: ^6.1.2
  just_audio: ^0.10.5
  audio_waveforms: ^1.3.0
  audioplayers: ^6.5.1
  image_picker: ^1.2.1
  google_mlkit_document_scanner: ^0.4.0
  pdf: ^3.11.3
  open_filex: ^4.7.0
  flutter_doc_scanner: ^0.0.16
  photo_view: ^0.15.0
  flick_video_player: ^0.9.0
  flutter_widget_from_html: ^0.17.1
  url_launcher: ^6.3.2
  curved_navigation_bar: ^1.0.6
  dropdown_button2: ^3.0.0
  fl_chart: ^1.1.1
  smooth_page_indicator: ^2.0.1
  flutter_intl_phone_field: ^0.0.7
  fluttertoast: ^9.0.0
  table_calendar: ^3.2.0

  # Notification packages (নতুন)
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  flutter_timezone: ^5.0.2

dev_dependencies:
  dependency_validator: ^5.0.3
  build_runner: ^2.4.8
  flutter_gen_runner: ^5.4.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_gen:
  output: lib/gen/
  line_length: 80

  colors:
    inputs:
      - assets/colors/colors.xml
    outputs:
      class_name: AppColors

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/fonts/
    - assets/colors/
    - assets/lottie/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter.ttf
